<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="64" cy="64" r="58" fill="#18181B" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Cash Drawer Base -->
  <rect x="22" y="86" width="84" height="18" rx="5" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="52" y="92" width="24" height="5" rx="2.5" fill="#64748B"/>
  <circle cx="94" cy="95" r="2.5" fill="#10B981"/>

  <!-- POS Terminal Stand -->
  <polygon points="56,68 72,68 78,86 50,86" fill="#475569"/>

  <!-- Touchscreen Monitor -->
  <rect x="28" y="24" width="72" height="48" rx="8" fill="url(#screenGrad)" stroke="url(#posGrad)" stroke-width="3"/>

  <!-- Screen Content: Kebab POS Interface -->
  <rect x="34" y="30" width="40" height="36" rx="4" fill="#090D16"/>
  <!-- Order Items in POS -->
  <rect x="38" y="34" width="22" height="4" rx="2" fill="#F59E0B"/>
  <rect x="38" y="42" width="28" height="4" rx="2" fill="#10B981"/>
  <rect x="38" y="50" width="18" height="4" rx="2" fill="#EF4444"/>
  <circle cx="70" cy="58" r="4" fill="#F59E0B"/>

  <!-- Receipt Paper Slot & Paper Ejecting -->
  <rect x="78" y="30" width="18" height="36" rx="3" fill="#1E293B"/>
  <path d="M 81 20 L 93 20 L 93 30 L 81 30 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="83" y1="23" x2="91" y2="23" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="83" y1="26" x2="89" y2="26" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Mini Chef Hat Floating Badge -->
  <g transform="translate(18, 14)">
    <circle cx="14" cy="12" r="12" fill="#DC2626"/>
    <path d="M 9 16 C 6 16 6 10 9 10 C 9 7 13 6 15 8 C 17 6 21 8 20 11 C 23 11 23 16 20 16 Z" fill="#FFFFFF"/>
    <rect x="9" y="15" width="11" height="2" fill="#DC2626"/>
  </g>
</svg>
