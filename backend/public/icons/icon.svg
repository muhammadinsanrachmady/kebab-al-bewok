<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FEF3C7" stroke-width="8" opacity="0.6" />

  <!-- Kebab Icon Graphics -->
  <g filter="url(#shadow)" transform="translate(100, 60)">
    <!-- Skewer / Stick -->
    <path d="M 156 360 L 156 420" stroke="#78350F" stroke-width="16" stroke-linecap="round" />
    
    <!-- Kebab Wrap / Tortilla -->
    <path d="M 60 140 C 40 260 90 350 156 360 C 222 350 272 260 252 140 Z" fill="#FDE68A" stroke="#D97706" stroke-width="8" />
    
    <!-- Grilled marks on wrap -->
    <line x1="100" y1="200" x2="212" y2="230" stroke="#B45309" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="90" y1="250" x2="222" y2="280" stroke="#B45309" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="110" y1="300" x2="202" y2="325" stroke="#B45309" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

    <!-- Fillings overflowing top (Beef, Lettuce, Tomato, Mayo) -->
    <!-- Lettuce -->
    <circle cx="95" cy="130" r="28" fill="#16A34A" />
    <circle cx="125" cy="115" r="30" fill="#22C55E" />
    <!-- Tomato / Chili -->
    <circle cx="215" cy="125" r="26" fill="#EF4444" />
    <!-- Roasted Beef Cuts -->
    <rect x="130" y="85" width="60" height="45" rx="12" fill="#7F1D1D" transform="rotate(-10 160 105)" />
    <rect x="160" y="95" width="55" height="40" rx="10" fill="#991B1B" transform="rotate(15 185 115)" />
    <!-- Cheese Drizzle -->
    <path d="M 110 135 Q 160 165 210 135" stroke="#FBBF24" stroke-width="10" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography: AL BEWOK -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    AL BEWOK
  </text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="700" font-size="20" fill="#FEF3C7" text-anchor="middle" letter-spacing="3">
    KEBAB
  </text>
</svg>
