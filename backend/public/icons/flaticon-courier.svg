<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="64" cy="64" r="58" fill="#18181B" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Speed Motion Trails -->
  <line x1="8" y1="84" x2="26" y2="84" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="14" y1="92" x2="32" y2="92" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Back Delivery Thermal Box (Kebab Hot Box) -->
  <rect x="24" y="44" width="28" height="26" rx="5" fill="url(#boxGrad)" stroke="#B45309" stroke-width="2"/>
  <rect x="28" y="48" width="20" height="4" rx="2" fill="#FEF3C7" opacity="0.8"/>
  <text x="38" y="63" font-family="sans-serif" font-weight="900" font-size="10" fill="#78350F" text-anchor="middle">KEBAB</text>

  <!-- Scooter Body Frame -->
  <path d="M 48 68 L 74 68 L 86 46 L 80 44" stroke="url(#scooterGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 50 68 L 56 82 L 40 82" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Handlebar & Headlight -->
  <line x1="76" y1="42" x2="88" y2="42" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="88" cy="46" r="4" fill="#FDE047"/>

  <!-- Front Shield -->
  <path d="M 82 46 L 78 72 L 88 72 Z" fill="url(#scooterGrad)"/>

  <!-- Wheels -->
  <!-- Back Wheel -->
  <circle cx="38" cy="86" r="14" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
  <circle cx="38" cy="86" r="5" fill="#CBD5E1"/>

  <!-- Front Wheel -->
  <circle cx="92" cy="86" r="14" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
  <circle cx="92" cy="86" r="5" fill="#CBD5E1"/>

  <!-- Floating GPS Navigation Marker -->
  <g transform="translate(76, 12)">
    <path d="M 16 0 C 8 0 2 6 2 14 C 2 24 16 36 16 36 C 16 36 30 24 30 14 C 30 6 24 0 16 0 Z" fill="#DC2626"/>
    <circle cx="16" cy="14" r="5" fill="#FFFFFF"/>
  </g>
</svg>
