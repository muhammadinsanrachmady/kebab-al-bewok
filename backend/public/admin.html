<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kebab AL Bewok - Dapur & Kasir Lapak</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- TOP HEADER ADMIN -->
  <header class="bg-amber-500 text-slate-900 p-4 sticky top-0 z-20 shadow-md flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">🏪</span>
      <div>
        <h1 class="font-black text-lg leading-tight">DAPUR & KASIR LAPAK</h1>
        <div class="flex items-center space-x-2 text-xs font-semibold">
          <span>Kebab AL Bewok</span>
          <span>•</span>
          <select id="adminBranchSelect" onchange="filterBranchOrders()" class="bg-amber-400 font-bold px-2 py-0.5 rounded outline-none cursor-pointer">
            <option value="cabang-01">Cabang Pasar Baru</option>
            <option value="cabang-02">Cabang Alun-Alun</option>
          </select>
        </div>
      </div>
    </div>

    <!-- STATS RINGKASAN HARIAN -->
    <div class="flex items-center space-x-3 bg-amber-400/80 p-2 rounded-2xl text-xs font-bold">
      <div class="px-2">
        <span class="text-[10px] text-amber-900 block font-normal">Omzet Bersih Makanan:</span>
        <span id="statFoodRevenue" class="text-slate-900 text-sm">Rp 0</span>
      </div>
      <div class="border-l border-amber-600/40 px-2">
        <span class="text-[10px] text-amber-900 block font-normal">Titipan Ongkir Kurir:</span>
        <span id="statDeliveryDebt" class="text-red-800 text-sm">Rp 0</span>
      </div>
      <button onclick="fetchOrders()" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl flex items-center space-x-1 shadow">
        <i class="fa-solid fa-arrows-rotate text-xs"></i>
        <span>Refresh</span>
      </button>
    </div>
  </header>

  <!-- KITCHEN DISPLAY KANBAN BOARD -->
  <main class="p-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">

      <!-- KOLOM 1: MENUNGGU VERIFIKASI PEMBAYARAN -->
      <div class="bg-slate-200/70 rounded-2xl p-3 space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-300">
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-yellow-500 rounded-full animate-ping"></span>
            <h2 class="font-extrabold text-xs uppercase tracking-wider text-slate-700">1. Verifikasi QRIS</h2>
          </div>
          <span id="countPending" class="bg-yellow-400 text-yellow-950 text-xs font-black px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="colPending" class="space-y-3 min-h-[300px]">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KOLOM 2: SEDANG DIMASAK DI DAPUR -->
      <div class="bg-slate-200/70 rounded-2xl p-3 space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-300">
          <div class="flex items-center space-x-2">
            <span class="text-base">🍳</span>
            <h2 class="font-extrabold text-xs uppercase tracking-wider text-slate-700">2. Sedang Dimasak</h2>
          </div>
          <span id="countCooking" class="bg-amber-500 text-white text-xs font-black px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="colCooking" class="space-y-3 min-h-[300px]">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KOLOM 3: MATANG & PANGGIL KURIR -->
      <div class="bg-slate-200/70 rounded-2xl p-3 space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-300">
          <div class="flex items-center space-x-2">
            <span class="text-base">🛵</span>
            <h2 class="font-extrabold text-xs uppercase tracking-wider text-slate-700">3. Cari / Antar Kurir</h2>
          </div>
          <span id="countReady" class="bg-blue-600 text-white text-xs font-black px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="colReady" class="space-y-3 min-h-[300px]">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KOLOM 4: SELESAI -->
      <div class="bg-slate-200/70 rounded-2xl p-3 space-y-3">
        <div class="flex items-center justify-between pb-1 border-b border-slate-300">
          <div class="flex items-center space-x-2">
            <span class="text-base">✅</span>
            <h2 class="font-extrabold text-xs uppercase tracking-wider text-slate-700">4. Pesanan Selesai</h2>
          </div>
          <span id="countCompleted" class="bg-emerald-600 text-white text-xs font-black px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="colCompleted" class="space-y-3 min-h-[300px]">
          <!-- Render via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL LIHAT STRUK BUKTI PEMBAYARAN -->
  <div id="proofModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white max-w-sm w-full rounded-3xl p-5 text-center space-y-4">
      <h3 class="font-black text-sm text-slate-800">Bukti Transfer QRIS Customer</h3>
      <div class="border rounded-2xl overflow-hidden shadow-inner">
        <img id="modalProofImg" src="" alt="Bukti Transfer" class="w-full max-h-72 object-contain bg-slate-50">
      </div>
      <button onclick="closeProofModal()" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs">
        Tutup
      </button>
    </div>
  </div>

  <script>
    let allOrders = [];

    async function init() {
      await fetchOrders();
      setInterval(fetchOrders, 3000);
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/admin/orders').then(r => r.json());
        if (res.success) {
          allOrders = res.data;
          renderKanban();
          calculateStats();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function filterBranchOrders() {
      renderKanban();
      calculateStats();
    }

    function getFilteredOrders() {
      const selectedBranch = document.getElementById('adminBranchSelect').value;
      return allOrders.filter(o => o.branch_id === selectedBranch);
    }

    function calculateStats() {
      const orders = getFilteredOrders();
      let foodSubtotal = 0;
      let deliveryDebt = 0;

      orders.forEach(o => {
        if (o.status !== 'pending_payment' && o.status !== 'cancelled') {
          foodSubtotal += o.food_subtotal || 0;
          deliveryDebt += o.delivery_fee || 0;
        }
      });

      document.getElementById('statFoodRevenue').innerText = `Rp ${foodSubtotal.toLocaleString('id-ID')}`;
      document.getElementById('statDeliveryDebt').innerText = `Rp ${deliveryDebt.toLocaleString('id-ID')}`;
    }

    function renderKanban() {
      const orders = getFilteredOrders();

      const pending = orders.filter(o => o.status === 'pending_payment' || o.status === 'pending_verification');
      const cooking = orders.filter(o => o.status === 'cooking');
      const readyOrDelivering = orders.filter(o => o.status === 'ready_for_pickup' || o.status === 'on_delivery');
      const completed = orders.filter(o => o.status === 'completed');

      document.getElementById('countPending').innerText = pending.length;
      document.getElementById('countCooking').innerText = cooking.length;
      document.getElementById('countReady').innerText = readyOrDelivering.length;
      document.getElementById('countCompleted').innerText = completed.length;

      // Render Kolom 1: Pending Verification
      const colPending = document.getElementById('colPending');
      colPending.innerHTML = pending.length === 0 ? `<p class="text-center text-slate-400 py-8 text-xs">Tidak ada antrean QRIS</p>` :
        pending.map(o => `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-yellow-300 space-y-2.5">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] text-slate-400 block">${new Date(o.created_at).toLocaleTimeString('id-ID')}</span>
                <h4 class="font-black text-slate-900 text-sm">#${o.order_code}</h4>
              </div>
              <span class="font-extrabold text-red-600 text-xs">Rp ${o.total_payment.toLocaleString('id-ID')}</span>
            </div>

            <div class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl">
              <span class="font-bold text-slate-800">${o.customer_name}</span> (${o.customer_phone})
              <div class="text-[11px] text-slate-500 mt-0.5 truncate">${o.customer_address}</div>
            </div>

            <div class="flex space-x-1.5 text-xs">
              <button onclick="viewProof('${o.payment_proof || 'https://placehold.co/400x600/png?text=Bukti+QRIS+Lunas'}')" class="flex-1 bg-yellow-50 hover:bg-yellow-100 text-yellow-800 font-bold py-1.5 rounded-lg border border-yellow-300 flex items-center justify-center space-x-1">
                <i class="fa-solid fa-receipt"></i>
                <span>Cek Struk</span>
              </button>
              <button onclick="verifyPayment('${o.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-1.5 rounded-lg shadow flex items-center justify-center space-x-1">
                <i class="fa-solid fa-check"></i>
                <span>Terima</span>
              </button>
            </div>
          </div>
        `).join('');

      // Render Kolom 2: Cooking
      const colCooking = document.getElementById('colCooking');
      colCooking.innerHTML = cooking.length === 0 ? `<p class="text-center text-slate-400 py-8 text-xs">Dapur kosong</p>` :
        cooking.map(o => `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border-2 border-amber-400 space-y-2.5">
            <div class="flex justify-between items-start">
              <h4 class="font-black text-slate-900 text-sm">#${o.order_code}</h4>
              <span class="bg-amber-100 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded">Dimasak</span>
            </div>

            <!-- DETAIL PESANAN KEBAB -->
            <div class="space-y-1.5 bg-amber-50/50 p-2.5 rounded-xl border border-amber-200 text-xs">
              ${o.items.map(item => `
                <div class="border-b border-amber-200/50 pb-1 last:border-0 last:pb-0">
                  <div class="font-extrabold text-slate-800">${item.quantity}x ${item.name}</div>
                  <div class="text-[11px] text-amber-900 font-semibold">• ${item.spice}</div>
                  ${item.toppings && item.toppings.length ? `<div class="text-[11px] text-emerald-700 font-semibold">• Topping: ${item.toppings.map(t => t.name).join(', ')}</div>` : ''}
                  ${item.notes ? `<div class="text-[10px] text-red-600 font-bold">• Note: ${item.notes}</div>` : ''}
                </div>
              `).join('')}
            </div>

            <div class="flex space-x-1.5 text-xs">
              <button onclick="printThermalReceipt('${o.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-2 rounded-xl flex items-center justify-center space-x-1 border">
                <i class="fa-solid fa-print"></i>
                <span>Cetak</span>
              </button>
              <button onclick="markAsReady('${o.id}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-2 rounded-xl text-xs shadow flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-bell"></i>
                <span>MATANG! PANGGIL KURIR</span>
              </button>
            </div>
          </div>
        `).join('');

      // Render Kolom 3: Ready for pickup / Delivering
      const colReady = document.getElementById('colReady');
      colReady.innerHTML = readyOrDelivering.length === 0 ? `<p class="text-center text-slate-400 py-8 text-xs">Tidak ada pengantaran aktif</p>` :
        readyOrDelivering.map(o => `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-blue-300 space-y-2">
            <div class="flex justify-between items-start">
              <h4 class="font-black text-slate-900 text-sm">#${o.order_code}</h4>
              <span class="${o.status === 'on_delivery' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'} text-[10px] font-bold px-2 py-0.5 rounded">
                ${o.status === 'on_delivery' ? 'Sedang Diantar' : 'Menunggu Kurir'}
              </span>
            </div>
            <div class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl">
              <span class="block text-[10px] text-slate-400">Kurir Pengantar:</span>
              <span class="font-bold text-slate-800">${o.driver_name || 'Mencari Kurir Freelance...'}</span>
            </div>
          </div>
        `).join('');

      // Render Kolom 4: Completed
      const colCompleted = document.getElementById('colCompleted');
      colCompleted.innerHTML = completed.length === 0 ? `<p class="text-center text-slate-400 py-8 text-xs">Belum ada pesanan selesai</p>` :
        completed.slice(0, 5).map(o => `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-emerald-200 text-xs space-y-1">
            <div class="flex justify-between">
              <span class="font-black text-slate-800">#${o.order_code}</span>
              <span class="text-emerald-600 font-extrabold">Rp ${o.total_payment.toLocaleString('id-ID')}</span>
            </div>
            <div class="text-[11px] text-slate-500">${o.customer_name} • Driver: ${o.driver_name || '-'}</div>
          </div>
        `).join('');
    }

    async function verifyPayment(orderId) {
      try {
        const res = await fetch(`/api/admin/orders/${orderId}/verify-payment`, { method: 'POST' }).then(r => r.json());
        if (res.success) {
          fetchOrders();
        }
      } catch (err) {
        alert('Gagal verifikasi');
      }
    }

    async function markAsReady(orderId) {
      try {
        const res = await fetch(`/api/admin/orders/${orderId}/ready`, { method: 'POST' }).then(r => r.json());
        if (res.success) {
          fetchOrders();
        }
      } catch (err) {
        alert('Gagal ubah status');
      }
    }

    function printThermalReceipt(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      const printWindow = window.open('', '_blank', 'width=380,height=600');
      printWindow.document.write(`
        <html>
        <head>
          <title>Struk Order #${order.order_code}</title>
          <style>
            @page { margin: 0; size: 58mm auto; }
            body {
              font-family: 'Courier New', monospace;
              width: 58mm;
              margin: 0;
              padding: 4mm;
              font-size: 11px;
              color: #000;
              line-height: 1.3;
            }
            .text-center { text-align: center; }
            .text-right { text-align: right; }
            .bold { font-weight: bold; }
            .divider { border-top: 1px dashed #000; margin: 5px 0; }
            .double-divider { border-top: 2px dashed #000; margin: 6px 0; }
          </style>
        </head>
        <body>
          <div class="text-center bold" style="font-size: 13px;">KEBAB AL BEWOK</div>
          <div class="text-center" style="font-size: 9px;">${order.branch_name}</div>
          <div class="text-center" style="font-size: 9px;">Hotline: 0852-8584-1330</div>
          
          <div class="double-divider"></div>
          <div>No. Order : <span class="bold">#${order.order_code}</span></div>
          <div>Waktu    : ${new Date(order.created_at).toLocaleString('id-ID')}</div>
          <div>Pelanggan: <span class="bold">${order.customer_name}</span></div>
          <div>No. HP   : ${order.customer_phone}</div>
          <div>Alamat   : ${order.customer_address}</div>
          
          <div class="divider"></div>
          <div class="bold" style="margin-bottom: 3px;">PESANAN DAPUR:</div>
          ${order.items.map(item => `
            <div><span class="bold">${item.quantity}x ${item.name}</span></div>
            <div style="padding-left: 8px; font-size: 10px;">• ${item.spice}</div>
            ${item.toppings && item.toppings.length ? `<div style="padding-left: 8px; font-size: 10px;">• Top: ${item.toppings.map(t => t.name).join(', ')}</div>` : ''}
            ${item.notes ? `<div style="padding-left: 8px; font-size: 10px; font-style: italic;">• Note: ${item.notes}</div>` : ''}
            <div class="text-right">${item.price ? 'Rp ' + (item.price * item.quantity).toLocaleString('id-ID') : ''}</div>
          `).join('')}
          
          <div class="divider"></div>
          <table style="width: 100%; font-size: 10px;">
            <tr><td>Subtotal</td><td class="text-right">Rp ${order.food_subtotal.toLocaleString('id-ID')}</td></tr>
            <tr><td>Ongkir Kurir</td><td class="text-right">Rp ${order.delivery_fee.toLocaleString('id-ID')}</td></tr>
            <tr class="bold" style="font-size: 11px;"><td>TOTAL</td><td class="text-right">Rp ${order.total_payment.toLocaleString('id-ID')}</td></tr>
          </table>

          <div class="divider"></div>
          <div class="text-center bold">[ LUNAS VIA QRIS ]</div>
          <div class="text-center" style="font-size: 9px; margin-top: 4px;">Rasa Nikmat, Harga Bersahabat!</div>
          <div class="text-center" style="font-size: 8px;">Terima kasih atas pesanannya</div>
          <br/><br/>
        </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => {
        printWindow.print();
        printWindow.close();
      }, 500);
    }

    function closeProofModal() {
      document.getElementById('proofModal').classList.add('hidden');
    }

    init();
  </script>
</body>
</html>
